services:
  bot:
    build: .
    image: demachi-discord-bot:local
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      STATE_FILE: /app/data/state.json
    volumes:
      - bot-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  bot-data:
